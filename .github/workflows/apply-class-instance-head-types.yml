name: Apply class instance head type fix

on:
  push:
    branches:
      - fix/class-instance-head-types

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          ref: fix/class-instance-head-types
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/cmd.rs'); s=p.read_text()
          needle='        self.elaborate_class(&mut local_env, &target)?;\n        let cmd_structure = self.class_structure_table.get(&target.id).cloned().unwrap();\n'
          repl='''        self.elaborate_class(&mut local_env, &target)?;\n        for local_type in &local_types {\n            if !target.args.iter().any(|arg| arg.contains_local(local_type.id)) {\n                let name = local_type\n                    .name\n                    .as_ref()\n                    .map_or_else(|| local_type.id.to_string(), ToString::to_string);\n                bail!(\n                    "class instance type parameter `{name}` does not occur in the instance head: {target}"\n                );\n            }\n        }\n        let cmd_structure = self.class_structure_table.get(&target.id).cloned().unwrap();\n'''
          assert needle in s
          p.write_text(s.replace(needle,repl,1))
          PY
          cargo fmt --all
          cargo test --all --all-features --locked
      - name: Commit fix
        run: |
          git rm .github/workflows/apply-class-instance-head-types.yml
          git config user.name 'Yuichi Nishiwaki'
          git config user.email 'yuichi.nishiwaki@icloud.com'
          git add src/cmd.rs
          git commit -m 'Reject hidden class instance type parameters'
          git push origin HEAD:fix/class-instance-head-types
