name: Inline inductive positivity check

on:
  push:
    branches:
      - fix/inductive-strict-positivity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: fix/inductive-strict-positivity
          fetch-depth: 0
      - name: Apply inline refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/cmd.rs')
          s=p.read_text()
          s=s.replace('''    proof::{\n        self, Axiom, Expr, generalize, guard, mk_type_prop, ungeneralize, ungeneralize1, unguard,\n        unguard1,\n    },\n''','''    proof::{self, Axiom, Expr, generalize, guard, mk_type_prop, ungeneralize, unguard},\n''',1)
          s,n=re.subn(r'fn validate_inductive_argument\(term: &Term, this: Id\) -> anyhow::Result<bool> \{.*?\n\}\n\n','',s,count=1,flags=re.S)
          if n != 1: raise SystemExit('helper not found')
          pattern=r'''            let mut ctor_ind_args = vec!\[\];\n            for ctor_arg in &ctor_args \{\n                if validate_inductive_argument\(ctor_arg, this\)\? \{\n                    ctor_ind_args\.push\(ctor_arg\.clone\(\)\);\n                \}\n            \}\n'''
          repl='''            let mut ctor_ind_args = vec![];\n            for ctor_arg in &ctor_args {\n                let mut current = ctor_arg.clone();\n                loop {\n                    let (ctor_params, body) = ungeneralize(&current);\n                    let (ctor_guards, next) = unguard(&body);\n                    for guard in &ctor_guards {\n                        if guard.contains_local(this) {\n                            bail!("constructor violates strict positivity");\n                        }\n                    }\n                    if ctor_params.is_empty() && ctor_guards.is_empty() {\n                        break;\n                    }\n                    current = next;\n                }\n                if !current.contains_local(this) {\n                    continue;\n                }\n                if !current.head().alpha_eq(&mk_local(this)) {\n                    bail!("invalid target");\n                }\n                for a in current.args() {\n                    if a.contains_local(this) {\n                        bail!("invalid target");\n                    }\n                }\n                ctor_ind_args.push(ctor_arg.clone());\n            }\n'''
          s,n=re.subn(pattern,repl,s,count=1)
          if n != 1: raise SystemExit('call site not found')
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test --all --all-features --locked
      - name: Commit refactor
        run: |
          git rm .github/workflows/inline-inductive-positivity-check.yml
          git config user.name 'Yuichi Nishiwaki'
          git config user.email 'yuichi.nishiwaki@icloud.com'
          git add src/cmd.rs
          git commit -m 'Inline inductive strict positivity validation'
          git push origin HEAD:fix/inductive-strict-positivity
