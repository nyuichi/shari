name: Apply inductive strict positivity fix

on:
  push:
    branches:
      - fix/inductive-strict-positivity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        with:
          ref: fix/inductive-strict-positivity
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/cmd.rs'); s=p.read_text()
          marker='        let mut ctor_params_list = vec![];\n'
          helper='''        fn validate_inductive_argument(term: &Term, this: Id) -> anyhow::Result<bool> {\n            if let Some((_param, body)) = ungeneralize1(term) {\n                return validate_inductive_argument(&body, this);\n            }\n            if let Some((guard, body)) = unguard1(term) {\n                if guard.contains_local(this) {\n                    bail!("constructor violates strict positivity");\n                }\n                return validate_inductive_argument(&body, this);\n            }\n            if !term.contains_local(this) { return Ok(false); }\n            if !term.head().alpha_eq(&mk_local(this)) {\n                bail!("invalid recursive occurrence in inductive constructor");\n            }\n            for arg in term.args() {\n                if arg.contains_local(this) {\n                    bail!("invalid recursive occurrence in inductive constructor");\n                }\n            }\n            Ok(true)\n        }\n\n        let mut ctor_params_list = vec![];\n'''
          assert marker in s
          s=s.replace(marker,helper,1)
          old='''            let mut ctor_ind_args = vec![];\n            for ctor_arg in &ctor_args {\n                let mut current = ctor_arg.clone();\n                loop {\n                    let (params, body) = ungeneralize(&current);\n                    let (args, next) = unguard(&body);\n                    if params.is_empty() && args.is_empty() {\n                        break;\n                    }\n                    current = next;\n                }\n                if current.contains_local(this) {\n                    if !current.head().alpha_eq(&mk_local(this)) {\n                        bail!("invalid target");\n                    }\n                    for a in current.args() {\n                        if a.contains_local(this) {\n                            bail!("invalid target");\n                        }\n                    }\n                    ctor_ind_args.push(ctor_arg.clone());\n                }\n            }\n'''
          new='''            let mut ctor_ind_args = vec![];\n            for ctor_arg in &ctor_args {\n                if validate_inductive_argument(ctor_arg, this)? {\n                    ctor_ind_args.push(ctor_arg.clone());\n                }\n            }\n'''
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          cargo fmt --all
          cargo test --all --all-features --locked
      - name: Commit fix
        run: |
          git rm .github/workflows/apply-inductive-strict-positivity.yml
          git config user.name 'Yuichi Nishiwaki'
          git config user.email 'yuichi.nishiwaki@icloud.com'
          git add src/cmd.rs
          git commit -m 'Fix strict positivity checking for inductive predicates'
          git push origin HEAD:fix/inductive-strict-positivity
